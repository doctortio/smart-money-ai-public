name: Smart Money AI Telegram worker (manual preflight)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        type: choice
        options: [dry_run, private_test, public_publish]
        default: dry_run
        required: true
      private_confirmation:
        description: "Type PRIVATE_TEST_AUTHORIZED only for an explicitly approved private send"
        type: string
        required: false
      public_slot:
        description: "Reserved public slot in America/Sao_Paulo"
        type: choice
        options: ["09:00", "14:00", "20:00"]
        default: "09:00"
        required: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    concurrency:
      group: smart-money-telegram-preflight
      cancel-in-progress: false
    env:
      TELEGRAM_DRY_RUN: ${{ inputs.mode != 'private_test' && 'true' || 'false' }}
      TELEGRAM_MODE: ${{ inputs.mode }}
      TELEGRAM_PRIVATE_CHAT_ID: ${{ secrets.TELEGRAM_PRIVATE_CHAT_ID }}
      PRIVATE_TEST_CONFIRMATION: ${{ inputs.private_confirmation }}
      PUBLIC_SLOT: ${{ inputs.public_slot }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r telegram_worker/requirements.txt pytest
      - run: python scripts/private_test_guard.py
      - name: Block public publication until separately authorized
        if: ${{ inputs.mode == 'public_publish' }}
        run: python scripts/public_publish_guard.py
      - name: Public publisher (disabled until explicit activation)
        if: ${{ inputs.mode == 'public_publish' }}
        env:
          TELEGRAM_DRY_RUN: "false"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_LEDGER_GATEWAY_URL: ${{ secrets.TELEGRAM_LEDGER_GATEWAY_URL }}
          TELEGRAM_LEDGER_HMAC_SECRET: ${{ secrets.TELEGRAM_LEDGER_HMAC_SECRET }}
          PUBLIC_PUBLISH_AUTHORIZED: ${{ secrets.PUBLIC_PUBLISH_AUTHORIZED }}
        run: python -m telegram_worker.public_publisher
      - run: python -m pytest tests/test_telegram_worker.py -q
      - run: python scripts/private_test_signals.py
      - name: Send one authorized private test message
        if: ${{ inputs.mode == 'private_test' }}
        env:
          TELEGRAM_DRY_RUN: "false"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PRIVATE_CHAT_ID: ${{ secrets.TELEGRAM_PRIVATE_CHAT_ID }}
          PRIVATE_TEST_CONFIRMATION: ${{ inputs.private_confirmation }}
        run: python -m scripts.private_test_send

# The production schedule is intentionally not enabled. Before activation,
# add cron entries converted to UTC and a durable idempotency store.
