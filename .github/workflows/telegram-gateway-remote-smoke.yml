name: Telegram Gateway Remote Smoke (No Publish)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-config-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests==2.32.3'
      - name: Verify HMAC config and replay rejection (no send)
        env:
          TELEGRAM_LEDGER_GATEWAY_URL: ${{ secrets.TELEGRAM_LEDGER_GATEWAY_URL }}
          TELEGRAM_LEDGER_HMAC_SECRET: ${{ secrets.TELEGRAM_LEDGER_HMAC_SECRET }}
        run: python tests/telegram_gateway_remote_smoke.py
