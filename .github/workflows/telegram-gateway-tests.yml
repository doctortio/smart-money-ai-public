name: Telegram gateway isolated tests

on:
  workflow_dispatch:

jobs:
  isolated:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: telegram_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d telegram_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TELEGRAM_DRY_RUN: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r telegram_worker/requirements.txt pytest
      - name: Python Telegram and signal center tests
        run: python -m pytest -q tests/test_ledger_gateway.py tests/test_private_test_send.py tests/test_telegram_worker.py tests/test_signal_center.py tests/test_signal_center_backend.py
      - name: Type-check Edge Function
        run: deno check supabase/functions/sma-telegram-ledger/index.ts
      - name: Prepare isolated SQL roles
        env:
          PGPASSWORD: isolated-test-only
        run: |
          psql -h 127.0.0.1 -U postgres -d telegram_test -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated; create role service_role; create table public.clientes (id bigint primary key, email text not null unique, tipo_usuario text, plano text);"
      - name: Apply isolated ledger migrations
        env:
          PGPASSWORD: isolated-test-only
        run: |
          psql -h 127.0.0.1 -U postgres -d telegram_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261021150000_telegram_worker_idempotency.sql
          psql -h 127.0.0.1 -U postgres -d telegram_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261022100000_telegram_ledger_gateway_replay.sql
          psql -h 127.0.0.1 -U postgres -d telegram_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261022110000_signal_center_admin.sql
          psql -h 127.0.0.1 -U postgres -d telegram_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261022113000_signal_center_admin_rpc.sql
      - name: SQL security and concurrency checks
        env:
          PGPASSWORD: isolated-test-only
        run: psql -h 127.0.0.1 -U postgres -d telegram_test -v ON_ERROR_STOP=1 -f tests/sql/telegram_gateway_isolated.sql
